# 本仓仅用于 R2 上传鉴权与本站资源绑定参考。
# 共享入口 Worker 名为 allworld；日常发布请用 `npm run deploy`（只写本站 R2 前缀），
# 切勿随意 `wrangler deploy` 覆盖共享 Worker，以免影响其他站点。
name = "allworld"
main = "worker/index.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
account_id = "57df712874237f41c6142eb723be3f21"
workers_dev = true

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-hb-ds-pacs-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
APP_NAME = "深州市医院影像诊断系统演示"
PROJECT_SLUG = "26-hb-ds-pacs"
REPO_NAME = "26-hb-ds-pacs"
SITE_SLUG = "26-hb-ds-pacs"
DEPLOYMENT_HOST = "https://26-hb-ds-pacs.softwarelink.net/"
HOST_DOMAIN = "https://26-hb-ds-pacs.softwarelink.net"
ROOT_DOMAIN = "softwarelink.net"
SITE_HOST = "https://26-hb-ds-pacs.softwarelink.net/"
TABLE_PREFIX = "ds_"
R2_SITE_PREFIX = "allworld-sites/26-hb-ds-pacs/"
